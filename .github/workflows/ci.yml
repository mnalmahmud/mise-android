name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        mise: ["2026.10.19", ""] # Empty selects the action's current stable default.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14" # Development tests only; the plugin runs in Lua.
      - uses: jdx/mise-action@v5
        with:
          version: ${{ matrix.mise }}
          install: false
          cache: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m pip install -r requirements-dev.txt
      - run: ruff check tests
      - run: ruff format --check tests
      - run: mise exec stylua@2.5.2 -- stylua --check lib hooks metadata.lua tests/unit.lua
