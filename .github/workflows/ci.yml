name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m pip install -r requirements-dev.txt
      - run: ruff check lib tests
      - run: ruff format --check lib tests

  mise-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        mise: ["2026.10.19", ""] # Empty selects the action's current stable default.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: jdx/mise-action@v5
        with:
          version: ${{ matrix.mise }}
          install: false
          cache: false
      - run: python3 -m unittest discover -s tests -v
        env:
          MISE_ANDROID_INTEGRATION: "1"
